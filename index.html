<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K&Y GOLF STUDIO | トップ</title>
  <style>
    :root { --primary-green: #0a2f1d; --ocean-blue: #0f3854; --accent-gold: #c5a059; --bg-light: #f7f9fa; --text-dark: #222222; --text-light: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--text-dark); background: var(--bg-light); line-height: 1.6; }
    a { text-decoration: none; color: inherit; }
    header { position: sticky; top: 0; z-index: 100; background: rgba(10,47,29,0.95); border-bottom: 2px solid var(--accent-gold); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { color: var(--text-light); font-size: 1.5rem; font-weight: bold; }
    .logo span { color: var(--accent-gold); }
    nav ul { display: flex; list-style: none; gap: 1.2rem; }
    nav a { color: var(--text-light); font-size: 0.95rem; }
    nav a:hover, nav a.active { color: var(--accent-gold); font-weight: bold; }
    .hero { height: 70vh; min-height: 400px; background: linear-gradient(135deg, rgba(10,47,29,0.85), rgba(15,56,84,0.85)); display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-light); padding: 0 1rem; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    .btn-cta { display: inline-block; background: linear-gradient(135deg, var(--accent-gold), #dfba73); color: var(--primary-green); padding: 0.8rem 2rem; font-weight: bold; border-radius: 50px; margin-top: 1rem; }
    .banner { background: linear-gradient(90deg, var(--ocean-blue), var(--primary-green)); color: var(--text-light); text-align: center; padding: 2rem 1rem; }
    .banner h2 { color: var(--accent-gold); font-size: 1.4rem; }
    section { padding: 4rem 5%; max-width: 1000px; margin: 0 auto; text-align: center; }
    .btn-more { display: inline-block; border: 2px solid var(--ocean-blue); color: var(--ocean-blue); padding: 0.5rem 1.5rem; border-radius: 5px; margin-top: 1rem; font-weight: bold; }
    footer { background: var(--primary-green); color: var(--text-light); text-align: center; padding: 2rem 1rem; margin-top: 3rem; border-top: 3px solid var(--accent-gold); }
  </style>
</head>
<body>

  <header>
    <div class="logo">K&Y <span>GOLF STUDIO</span></div>
    <nav>
      <ul>
        <li><a href="index.html" class="active">ホーム</a></li>

        <li><a href="price.html">料金プラン</a></li>
        <li><a href="access.html">アクセス</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
      </ul>
    </nav>
  </header>

  <div class="hero">
    <div>
      <h1>K&Y Golf Studioへようこそ</h1>
      <p>代表 宮川勝大 による直接指導で、あなたのゴルフが変わる。</p>
      <a href="price.html" class="btn-cta">料金プランを見る</a>
    </div>
  </div>

  <div class="banner">
    <h2>🏆 確かな指導力と実績</h2>
    <p>全国大会上位ジュニアゴルファーも多数輩出！</p>
  </div>

  <section>
    <h2>コンセプト</h2>
    <p style="margin-top: 1rem;">初心者から本格的なアスリート志向の方まで、個々に合わせたスイング理論でサポートいたします。</p>
    <a href="about.html" class="btn-more">代表・スクール紹介へ</a>
  </section>

  <footer>
    <p>&copy; 2026 K&Y GOLF STUDIO</p>
  </footer>

</body>
</html>
